@if (!isAuthPage()) {
<div class="min-h-screen bg-gray-50">
  <!-- Sidebar -->
  <app-sidebar [isOpen]="sidebarOpen()" (toggleSidebar)="toggleSidebar()"
    class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-lg transform transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0"
    [class.translate-x-0]="sidebarOpen()" [class.-translate-x-full]="!sidebarOpen()">
  </app-sidebar>

  <!-- Overlay para cerrar sidebar en dispositivos móviles -->
  @if (sidebarOpen()) {
  <div class="fixed inset-0 z-40 bg-gray-600 bg-opacity-75 lg:hidden" (click)="closeSidebar()">
  </div>
  }

  <!-- Contenido principal -->
  <div class="lg:ml-64">
    <!-- Header -->
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Main content -->
    <main class="p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
}

<!-- Auth pages sin layout -->
@if (isAuthPage()) {
<div class="min-h-screen">
  <router-outlet></router-outlet>
</div>
}
